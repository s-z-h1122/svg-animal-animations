        <circle cx="1.5" cy="-.2" r="7.4" fill="#273936"/>
        <circle cx="3.8" cy="-3.4" r="2.5" fill="#fff9e6"/>
      </g></g>
      <!-- A shallow cycling cap with a raised peak. -->
      <g transform="rotate(-8 592 164)">
        <path d="M544 171c6-27 25-47 53-48 21-1 44 12 51 34l-17 8-68 9Z" fill="#358373" stroke="#304b41" stroke-width="3.5"/>
        <path d="M587 124q10-3 18 0c13 5 23 17 28 35l-13 4c-6-19-17-32-33-39Z" fill="#f4c45b"/>
        <path d="M546 164q12-27 32-31" fill="none" stroke="#74ae91" stroke-width="2.7"/>
        <path d="M544 167q43-5 88-12l15 2-4 10q-51 3-96 11l-5-4Z" fill="#27695f" stroke="#304b41" stroke-width="2.7"/>
        <path d="M610 164c13-5 33-10 48-11 11 0 18 1 22 5 2 3-4 5-12 6l-41 4Z" fill="#4e9581" stroke="#304b41" stroke-width="2.9"/>
        <path d="m632 162 27-5" fill="none" stroke="#8bb296" stroke-width="1.8"/>
      </g>
    </g>
  </g>
  <g data-strip="verge-tile" data-speed="335"><use href="#verge-tile"/></g>
  <rect id="texture" x="0" y="0" width="1200" height="760" fill="url(#paper)" opacity=".25" pointer-events="none"/>
</svg>
<button id="motion" type="button" data-paused="false" aria-label="暂停动画" title="暂停动画" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path class="pause" d="M6 4h4v16H6zm8 0h4v16h-4z"/><path class="play" d="M7 4v16l13-8z"/></svg>
</button>
</main>
<script>
(() => {
  'use strict';
  const svgNS = 'http://www.w3.org/2000/svg';
  const byId = id => document.getElementById(id);
  const scene = byId('scene');
  const texture = byId('texture');
  const motion = byId('motion');
  const strips = Array.from(scene.querySelectorAll('[data-strip]'), group => ({
    group, tile: group.dataset.strip, speed: Number(group.dataset.speed)
  }));
  const tileWidth = 1200;
  function resize() {
    const ratio = scene.clientWidth / Math.max(scene.clientHeight, 1);
    if (!ratio) return;
    const height = Math.max(755, 650 / ratio);
    const width = height * ratio;
    const x = 585 - width / 2, y = 388 - height / 2;
    scene.setAttribute('viewBox', [x, y, width, height].join(' '));
    Object.entries({ x, y, width, height }).forEach(([key, val]) => texture.setAttribute(key, val));
    const first = Math.floor(x / tileWidth);
    const last = Math.ceil((x + width) / tileWidth);
    strips.forEach(({ group, tile }) => {
      const copies = document.createDocumentFragment();
      for (let i = first; i <= last + 1; i++) {
        const copy = document.createElementNS(svgNS, 'use');
        copy.setAttribute('href', '#' + tile);
        copy.setAttribute('x', i * tileWidth);
        copies.append(copy);
      }
      group.replaceChildren(copies);
    });
  }
  const attr = (node, key, val) => node.setAttribute(key, val);
  function getLeg(name, hipX, hipY, upper, lower) {
    return { hipX, hipY, upper, lower, edge: byId(name + '-leg-edge'),
      fill: byId(name + '-leg-fill'), shoe: byId(name + '-shoe'), arm: byId(name + '-arm') };
  }
  const near = getLeg('near', 530, 369, 85, 85);
  const far = getLeg('far', 520, 365, 88, 86);
  const scales = byId('leg-scales');
  const armShine = byId('near-arm-shine');
  const rearWheel = byId('wheel-rear'), frontWheel = byId('wheel-front');
  const bird = byId('bird'), tail = byId('tail'), eye = byId('eye');
  function pedal(leg, phase, sway, bob) {
    const px = 563 + 29 * Math.cos(phase), py = 520 + 29 * Math.sin(phase);
    const hx = leg.hipX + sway, hy = leg.hipY + bob;
    const ax = px - 9, ay = py - 10;
    const dx = ax - hx, dy = ay - hy, distance = Math.hypot(dx, dy);
    const ux = dx / distance, uy = dy / distance;
    const along = (leg.upper ** 2 - leg.lower ** 2 + distance ** 2) / (2 * distance);
    const bend = Math.sqrt(Math.max(0, leg.upper ** 2 - along ** 2));
    const jx = hx + along * ux - bend * uy, jy = hy + along * uy + bend * ux;
    const limb = 'M' + hx + ' ' + hy + ' L' + jx + ' ' + jy + ' L' + ax + ' ' + ay;
    attr(leg.edge, 'd', limb);
    attr(leg.fill, 'd', limb);
    const crank = 'M563 520 L' + px + ' ' + py;
    attr(leg.arm, 'd', crank);
    attr(leg.shoe, 'transform', 'translate(' + px + ' ' + py + ')');
    if (leg === near) {
      attr(armShine, 'd', crank);
      const vx = ax - jx, vy = ay - jy, length = Math.hypot(vx, vy);
      let marks = '';
      for (const pos of [.32, .46, .60, .74]) {
        const mx = jx + vx * pos, my = jy + vy * pos;
        marks += 'M' + (mx - vy / length * 3) + ' ' + (my + vx / length * 3)
          + 'l' + (vy / length * 6) + ' ' + (-vx / length * 6);
      }
      attr(scales, 'd', marks);
    }
  }
  function draw(t) {
    const phase = t * 2.42 - .35;
    const sway = .8 * Math.sin(phase), bob = 1.7 * Math.sin(phase * 2);
    const rotate = 'rotate(' + (t * 280 / 100 * 180 / Math.PI % 360) + ')';
    attr(rearWheel, 'transform', rotate);
    attr(frontWheel, 'transform', rotate);
    attr(bird, 'transform', 'translate(' + sway + ' ' + bob + ')');
    attr(tail, 'transform', 'rotate(' + (1.3 * Math.sin(phase * 2 - .6)) + ' 496 334)');
    const blink = (t + 1.7) % 4.8;
    attr(eye, 'transform', 'scale(1 ' + Math.min(1, .06 + Math.abs(blink - .12) * 8) + ')');
    pedal(near, phase, sway, bob);
    pedal(far, phase + Math.PI, sway, bob);
    for (const { group, speed } of strips) {
      attr(group, 'transform', 'translate(' + (-(t * speed % tileWidth)) + ' 0)');
    }
  }
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = reduced.matches, elapsed = 0, last = null, frame = 0;
  function tick(now) {
    if (last !== null) elapsed += (now - last) / 1000;
    last = now;
    draw(elapsed);
    frame = requestAnimationFrame(tick);
  }
  function sync() {
    cancelAnimationFrame(frame);
    last = null;
    motion.dataset.paused = String(paused);
    const label = paused ? '播放动画' : '暂停动画';
    motion.setAttribute('aria-label', label);
    motion.title = label;
    if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
  }
  motion.addEventListener('click', () => { paused = !paused; sync(); });
  reduced.addEventListener('change', event => { paused = event.matches; sync(); });
  document.addEventListener('visibilitychange', sync);
  window.addEventListener('resize', resize);
  resize();
  draw(0);
  motion.hidden = false;
  sync();
})();
</script>
</body>
</html>
