<script>
(() => {
  'use strict';
  const ns = 'http://www.w3.org/2000/svg';
  const byId = id => document.getElementById(id);
  const field = byId('field'), roo = byId('roo'), pole = byId('pole');
  const shaftLayers = ['shaft','shaft-enamel','shaft-color','shaft-grip'].map(byId);
  const tail = byId('tail'), eye = byId('eye'), ears = byId('ears');
  const runShadow = byId('run-shadow'), matShadow = byId('mat-shadow'), dust = byId('dust');
  const matTop = byId('mat-top'), clouds = byId('clouds'), button = byId('motion');
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const rad = a => a * Math.PI / 180;
  const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const mix = (a, b, t) => a + (b - a) * t;
  const point = (x, y) => ({ x, y });
  const plus = (a, b) => point(a.x + b.x, a.y + b.y);
  const minus = (a, b) => point(a.x - b.x, a.y - b.y);
  const lerp = (a, b, t) => point(mix(a.x,b.x,t), mix(a.y,b.y,t));
  const xy = p => p.x.toFixed(2) + ' ' + p.y.toFixed(2);
  function rotate(p, angle) {
    const c = Math.cos(rad(angle)), s = Math.sin(rad(angle));
    return point(c * p.x - s * p.y, s * p.x + c * p.y);
  }
  // Monotone cubic interpolation gives continuous velocities without overshooting a key pose.
  function sample(keys, t) {
    if (t <= keys[0][0]) return keys[0].slice(1);
    const end = keys.length - 1;
    if (t >= keys[end][0]) return keys[end].slice(1);
    let i = 0; while (keys[i+1][0] < t) i++;
    const a = keys[i], b = keys[i+1], dt = b[0]-a[0], u = (t-a[0])/dt;
    function slope(j, k) {
      const p = keys[j], prev = keys[j-1], next = keys[j+1];
      if (!prev) return (next[k]-p[k])/(next[0]-p[0]);
      if (!next) return (p[k]-prev[k])/(p[0]-prev[0]);
      const left = (p[k]-prev[k])/(p[0]-prev[0]), right = (next[k]-p[k])/(next[0]-p[0]);
      return left*right <= 0 ? 0 : 2*left*right/(left+right);
    }
    return a.slice(1).map((v,k) => {
      const j=k+1, u2=u*u, u3=u2*u;
      return (2*u3-3*u2+1)*v+(u3-2*u2+u)*dt*slope(i,j)
        +(-2*u3+3*u2)*b[j]+(u3-u2)*dt*slope(i+1,j);
    });
  }
  function path(parent, fill, stroke, width) {
    const p = document.createElementNS(ns,'path');
    p.setAttribute('fill',fill); p.setAttribute('stroke',stroke); p.setAttribute('stroke-width',width);
    parent.append(p); return p;
  }
  function makeLeg(id, rear) {
    const g=byId(id), fur=rear?'#ad7047':'#d68a47', edge=rear?'#684d3d':'#543f34';
    return { lowerEdge:path(g,'none',edge,11), lower:path(g,'none',rear?'#c49465':'#e3b079',6.7),
      thigh:path(g,fur,edge,3), accent:path(g,'none',rear?'#c88850':'#edaa65',2),
      foot:path(g,rear?'#93664c':'#b88154',edge,2.6), toes:path(g,'none',edge,1.4) };
  }
  function makeArm(id, rear) {
    const g=byId(id);
    return { edge:path(g,'none',rear?'#79553d':'#584135',rear?8:9.5),
      fur:path(g,'none',rear?'#b47c4b':'#db9c61',rear?4.4:6),
      paw:path(g,rear?'#876249':'#9a6c4a',rear?'#694b39':'#563f33',1.8) };
  }
  const nearLeg=makeLeg('front-leg',false), farLeg=makeLeg('back-leg',true);
  const nearArm=makeArm('front-arm',false), farArm=makeArm('back-arm',true);
  function drawLeg(parts, hip, ankle, angle) {
    const dx=ankle.x-hip.x, dy=ankle.y-hip.y, len=Math.max(1,Math.hypot(dx,dy));
    const side=clamp(48-len*.21,16,39);
    const k=point(hip.x+dx*.47+dy/len*side, hip.y+dy*.47-dx/len*side);
    const shin='M'+xy(k)+' Q'+xy(lerp(k,ankle,.6))+' '+xy(ankle);
    parts.lowerEdge.setAttribute('d',shin); parts.lower.setAttribute('d',shin);
    const thigh='M'+xy(plus(hip,point(-19,-7)))+' C'+xy(plus(hip,point(-19,-31)))+' '+xy(plus(hip,point(14,-32)))+' '+xy(plus(hip,point(23,-8)))+' Q'+xy(plus(k,point(12,-4)))+' '+xy(plus(k,point(5,5)))+' Q'+xy(plus(k,point(-2,12)))+' '+xy(plus(k,point(-10,5)))+' Q'+xy(plus(hip,point(-19,20)))+' '+xy(plus(hip,point(-19,-7)))+'Z';
    parts.thigh.setAttribute('d',thigh);
    parts.accent.setAttribute('d','M'+xy(plus(hip,point(-12,-10)))+'q1-10 12-13');
    const footTransform='translate('+xy(ankle)+') rotate('+angle+')';
    parts.foot.setAttribute('d','M-4-3q3-4 8 0c9 5 26 5 36 4l7 1q3 3-1 5c-14 3-32 3-46 0q-6-1-4-10Z');
    parts.foot.setAttribute('transform',footTransform);
    parts.toes.setAttribute('d','m35 4 9-1m-5 3 8-1');
    parts.toes.setAttribute('transform',footTransform);
  }
  function drawArm(parts, shoulder, wrist, open) {
    const d=minus(wrist,shoulder), len=Math.max(1,Math.hypot(d.x,d.y));
    const offset=clamp(31-len*.25,5,23);
    const elbow=point((shoulder.x+wrist.x)*.5 + d.y/len*offset, (shoulder.y+wrist.y)*.5 - d.x/len*offset+5);
    const arm='M'+xy(shoulder)+' Q'+xy(lerp(shoulder,elbow,.65))+' '+xy(elbow)+' L'+xy(wrist);
    parts.edge.setAttribute('d',arm); parts.fur.setAttribute('d',arm);
    parts.paw.setAttribute('d',open?'M-3 2q-2-4 0-7l3-5q2-1 2 1l-1 5 4-6q2-1 2 1l-3 7 4-4q2 0 1 2L4 3Q0 6-3 2Z':'M-5-2q0-4 4-4l6 1 2 3-1 5q-1 2-3 0l-1-3-1 4q-3 2-4-1Z');
    parts.paw.setAttribute('transform','translate('+xy(wrist)+')');
  }

  const plant=3.25, release=5.50, cycle=10.5, length=360, box=point(880,607);
  const startAngle=Math.asin(160/length)*180/Math.PI;
  const plantX=box.x-Math.sqrt(length*length-160*160)-13;
  const swing=[
    [plant,startAngle,360,0,13,-65],[3.52,34,334,-12,15,-68],
    [3.85,44,299,-42,18,-71],[4.17,55,283,-78,16,-74],
    [4.45,65,296,-107,14,-76],[4.75,73.5,322,-137,13,-78],
    [5.04,81,350,-158,14,-81],[5.31,89.5,360,-168,13,-84],
    [release,95,360,-172,13,-85]
  ];
  const releasingHand=minus(box,rotate(point(length,0),95));
  const releaseHip=minus(releasingHand,rotate(point(13,-85),-172));
  const flight=[
    [release,releaseHip.x,releaseHip.y,-172],[5.72,969,141,-161],[5.97,1006,129,-145],
    [6.22,1042,131,-125],[6.48,1080,154,-105],[6.73,1113,195,-89],
    [6.98,1143,251,-78],[7.25,1172,322,-76],[7.52,1193,404,-79],
    [7.83,1212,489,-86],[7.96,1216,501,-88],[8.15,1214,487,-82],
    [8.39,1208,486,-61],[8.72,1192,490,-20],[9.08,1179,495,-3],[9.36,1176,495,0],[cycle,1176,495,0]
  ];
  const stride=.64;
  const runFoot=[[0,23,-9,0],[.18,8,-8,0],[.38,-12,-20,16],[.5,-23,-35,29],[.64,-32,-57,23],[.8,-17,-59,-12],[1,23,-9,0]];
  const gaitAt=t=>(((t-plant)/stride+.38)%1+1)%1;
  function runHip(t) {
    const p=gaitAt(t), jump=p>.4?Math.sin(Math.PI*(p-.4)/.6)**2:0;
    return point(mix(145,plantX,t/plant),512-18*jump);
  }
  function runningFoot(t, hipY, rear) {
    const p=(gaitAt(t)+(rear?.065:0))%1, [x,y,a]=sample(runFoot,p);
    return [x+(rear?-8:0),607+y-hipY+(rear?-2:0),a+(rear?-3:0)];
  }
  function footKeys(rear) {
    const start=runningFoot(plant,512,rear), offset=rear?-10:0;
    const rows=[[3.5,-27,65,22],[3.8,-35,75,23],[4.1,-17,90,10],[4.4,17,89,-6],
      [4.8,19,81,-8],[5.1,14,77,-5],[5.5,11,79,-6],[5.82,22,66,-13],
      [6.15,26,51,-20],[6.50,9,47,-26],[6.85,-9,63,-27],[7.4,6,69,-19],
      [7.83,10,69,-31],[8.12,16,61,-29],[8.4,17,41,-16],[8.88,-12,21,-3],[cycle,-12,21,-3]];
    return [[plant,...start],...rows.map(([t,x,y,a])=>[t,x+offset,y+(rear?-5:0),a+(rear?6:0)])];
  }
  const nearFoot=footKeys(false), farFoot=footKeys(true);
  const tailKeys=[[plant,0],[3.65,9],[4.1,16],[4.65,6],[5.2,-13],[5.75,-30],[6.25,-50],[6.85,-70],[7.52,-87],[7.99,-94],[8.4,-57],[8.88,-5],[9.19,8],[cycle,8]];
  const fallingPole=[[release,95],[5.76,93],[6.01,84],[6.35,65],[6.70,33],[7.02,1.6],[7.13,6],[7.34,1.4],[7.46,2.4],[7.62,1.3],[cycle,1.3]];
  const freeArm=[[release,13,-85],[5.78,32,-85],[6.19,52,-60],[6.7,45,-35],[7.38,48,-28],[7.9,38,-41],[8.4,30,-39],[9,34,-52],[9.28,49,-84],[9.48,53,-80],[9.69,48,-88],[cycle,48,-88]];
  const secondArm=[[4.72,22,-112],[5.12,27,-92],[5.5,32,-74],[6.1,40,-45],[6.72,37,-31],[7.86,32,-37],[8.5,22,-41],[9.2,28,-47],[cycle,28,-47]];
  // Solve the quadratic bow for a fixed arc length as the athlete loads the pole.
  function bowFor(chord) {
    if (chord>=length-.005) return 0;
    let lo=0,hi=length;
    for(let i=0;i<15;i++) {
      const bend=(lo+hi)*.5, k=2*bend/chord;
      const arc=.5*chord*(Math.hypot(1,k)+Math.asinh(k)/k);
      if(arc<length) lo=bend; else hi=bend;
    }
    return (lo+hi)*.5;
  }
  function geometry(grip,tip) {
    const d=minus(tip,grip), chord=Math.hypot(d.x,d.y), bend=bowFor(chord);
    const control=plus(lerp(grip,tip,.5),point(d.y/chord*bend,-d.x/chord*bend));
    const tangent=minus(control,grip), speed=Math.hypot(tangent.x,tangent.y);
    const butt=minus(grip,point(tangent.x/speed*20,tangent.y/speed*20));
    const u=44/(2*speed);
    const other=lerp(lerp(grip,control,u),lerp(control,tip,u),u);
    const line='M'+xy(butt)+' L'+xy(grip)+' Q'+xy(control)+' '+xy(tip);
    for (const layer of shaftLayers) layer.setAttribute('d',line);
    return other;
  }
  let width=1440,height=760;
  function resize() {
    const ratio=field.clientWidth/Math.max(1,field.clientHeight);
    if(!ratio) return;
    width=ratio>=1.18?Math.max(1440,ratio*710):Math.max(545,ratio*810);
    height=width/ratio;
  }
  function draw(t, firstPass) {
    let hip, angle, hand, tip, gripLocal;
    if(t<plant) {
      hip=runHip(t); angle=0;
      gripLocal=point(13,-65); hand=plus(hip,gripLocal);
      const carried=mix(-17,startAngle,ease((t-.45)/(plant-.45)));
      tip=plus(hand,rotate(point(length,0),carried));
    } else if(t<=release) {
      const [a,r,tilt,gx,gy]=sample(swing,t);
      angle=tilt; gripLocal=point(gx,gy); tip=box;
      hand=minus(box,rotate(point(r,0),a));
      hip=minus(hand,rotate(gripLocal,angle));
    } else {
      const [x,y,tilt]=sample(flight,t);
      hip=point(x,y); angle=tilt;
      gripLocal=point(...sample(freeArm,t)); tip=box;
      hand=minus(box,rotate(point(length,0),sample(fallingPole,t)[0]));
    }
    const other=geometry(hand,tip);
    const localOther=rotate(minus(other,hip),-angle);
    let farWrist=localOther;
    if(t>4.72) farWrist=lerp(localOther,point(...sample(secondArm,t)),ease((t-4.72)/.22));
    roo.setAttribute('transform','translate('+xy(hip)+') rotate('+angle+')');
    const nf=t<plant?runningFoot(t,hip.y,false):sample(nearFoot,t);
    const ff=t<plant?runningFoot(t,hip.y,true):sample(farFoot,t);
    drawLeg(farLeg,point(-5,-3),point(ff[0],ff[1]),ff[2]);
    drawLeg(nearLeg,point(-6,0),point(nf[0],nf[1]),nf[2]);
    drawArm(farArm,point(16,-53),farWrist,t>4.85&&t<7.84);
    drawArm(nearArm,point(9,-49),gripLocal,(t>release+.07&&t<7.84)||t>9.12);
    const wag=t<plant?3*Math.sin(2*Math.PI*(t-plant)/stride):sample(tailKeys,t)[0];
    tail.setAttribute('transform','rotate('+wag+' -11 3)');
    const earLag=t<plant?3*Math.sin((t-plant)*2*Math.PI/stride):2.7*Math.sin((t-plant)*4.5);
    ears.setAttribute('transform','rotate('+earLag+' 20 -104)');
    const blink=Math.min(...[1.32,7.93,9.62].map(b=>Math.abs(t-b)));
    eye.setAttribute('transform','scale(1 '+clamp(blink/.086,.09,1)+')');
    const opacity=Math.min(firstPass?1:ease(t/.25),1-ease((t-10)/.50));
    roo.setAttribute('opacity',opacity); pole.setAttribute('opacity',opacity);
    runShadow.setAttribute('cx',hip.x-8);
    runShadow.setAttribute('rx',Math.max(20,68-(512-hip.y)*.09));
    runShadow.setAttribute('opacity',.28*opacity*(1-ease((t-plant)/1.2)));
    matShadow.setAttribute('cx',clamp(hip.x,980,1250));
    matShadow.setAttribute('rx',44+30*ease((t-6.9)/.9));
    matShadow.setAttribute('opacity',.32*opacity*ease((t-6.8)/1.05));
    const dent=9*Math.max(0,1-Math.abs(t-7.96)/.16);
    matTop.setAttribute('d','M918 536 960 502H1285L1338 536Q1240 '+(540+dent)+' 1160 '+(539+dent)+'L969 543Z');
    const p=gaitAt(t);
    dust.setAttribute('transform','translate('+(hip.x-13-47*p)+' '+(604-16*p)+') scale('+(1+p*.4)+')');
    dust.setAttribute('opacity',t<plant?.58*opacity*(1-ease((p-.13)/.54)):0);
    clouds.setAttribute('transform','translate('+(7*Math.sin(2*Math.PI*t/cycle))+ ' 0)');
    const cameraX=width>=1440?(1440-width)/2:clamp(hip.x+65-width*.5,0,1440-width);
    field.setAttribute('viewBox',[cameraX,365-height*.5,width,height].join(' '));
  }
  const preference=matchMedia('(prefers-reduced-motion: reduce)');
  let paused=preference.matches, elapsed=preference.matches?4.45:0, last=null, frame=0;
  function tick(now) {
    if(last!==null) elapsed+=(now-last)/1000;
    last=now; draw(elapsed%cycle,elapsed<cycle);
    frame=requestAnimationFrame(tick);
  }
  function sync() {
    cancelAnimationFrame(frame); last=null;
    const label=paused?'播放动画':'暂停动画';
    button.dataset.paused=String(paused); button.setAttribute('aria-label',label); button.title=label;
    if(!paused&&!document.hidden) frame=requestAnimationFrame(tick);
  }
  window.addEventListener('resize',()=>{resize();draw(elapsed%cycle,elapsed<cycle);});
  button.addEventListener('click',()=>{paused=!paused;sync();});
  preference.addEventListener('change',e=>{paused=e.matches;sync();});
  document.addEventListener('visibilitychange',sync);
  resize(); draw(elapsed%cycle,true); button.hidden=false; sync();
})();
</script>
</body>
</html>
